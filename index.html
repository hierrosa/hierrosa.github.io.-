<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Räume für Jeden</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/main.css">
</head>

<body>

<div class="hero-bg">
  <svg viewBox="0 0 1440 500" preserveAspectRatio="none">
    <path d="M0,220 C220,40 420,20 760,170 C980,270 1120,70 1440,160 L1440,0 L0,0 Z"
      fill="var(--hero-blue)" />

    <path  d="
        M40,0
        L180,0
        C260,80 260,240 400,320
        C120,380 40,340 20,240
        C200,160 0,80 40,0
        Z
      "
      fill="var(--hero-green)" />

    <path d="M1240,50 C1400,0 1410,20 1360,500 C1290,420 1230,250 1240,120 L1160,120 C980,60 1210,20 1240,100 Z"
      fill="var(--hero-orange)" />
  </svg>
</div>
<div class="content">
<header class="hero">
  <div class="hero-text">
    <h1>Räume für Jeden <br>– inklusiv, immersiv, interaktiv</h1>
    <p>Interventionen mit dem CJD am Standort Sickinger Straße, Berlin - SS2026 - BHT - Transformation Design & Print</p>
  </div>
</header>

<div class="filters">
  <div class="filter-top">

    <div class="filter-group">
      <strong>01 / Kategorie</strong>
      <div id="filter-kategorie"></div>
    </div>

    <div class="filter-group">
      <strong>02 / Status</strong>
      <div id="filter-status"></div>
    </div>

  </div>
</div>

<section id="grid" class="grid"></section>

</div>
<div id="overlay" class="overlay">
  <div class="close" id="closeBtn">✕</div>

  <div class="overlay-inner">
    <div id="detail-kategorie"></div>
    <h2 id="detail-title"></h2>
    <span id="detail-status" class="status"></span>

    <div class="detail-layout">
      <div id="detail-images" class="detail-images"></div>
  <div id="detail-images" class="detail-images"></div>

<p id="detail-text"></p>
</div>
      <p id="detail-text"></p>
    </div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
